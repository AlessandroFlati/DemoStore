def loadEnv() {
    def props = new Properties()
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.withInputStream { stream ->
            props.load(stream)
        }
    }
    return props
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "4.0.0.2929"
    id "checkstyle"
}

group = 'demo.store'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micronaut.micrometer:micronaut-micrometer-core:5.8.0'
    implementation 'io.micronaut.micrometer:micronaut-micrometer-registry-prometheus:5.8.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def env = loadEnv()

sonar {
    properties {
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", env.get("SONAR_TOKEN")
    }
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file("${rootDir}/checkstyle.xml")
    ignoreFailures = false
    showViolations = true
}

checkstyleMain {
    reports {
        xml.required = true
        html.required = false
    }
}